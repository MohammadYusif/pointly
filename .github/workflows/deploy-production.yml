name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm deployment'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'
  AWS_REGION: me-south-1
  ENVIRONMENT: prod

jobs:
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "production" ]]; then
            echo "Deployment not confirmed. Please type 'production' to confirm."
            exit 1
          fi

      - name: Validate release
        if: github.event_name == 'release'
        run: |
          echo "Deploying release: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"

  deploy-infrastructure:
    name: Deploy Infrastructure (Production)
    runs-on: ubuntu-latest
    needs: validate-deployment
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://api.pointly.sa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Bootstrap (if needed)
        working-directory: packages/infrastructure
        run: pnpm run bootstrap
        continue-on-error: true

      - name: CDK Diff
        working-directory: packages/infrastructure
        run: pnpm run diff --context environment=${{ env.ENVIRONMENT }}

      - name: CDK Deploy
        working-directory: packages/infrastructure
        run: pnpm run deploy:prod

      - name: Get stack outputs
        id: stack-outputs
        working-directory: packages/infrastructure
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name Pointly-Api-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

    outputs:
      api_url: ${{ steps.stack-outputs.outputs.api_url }}

  build-and-deploy-api:
    name: Build & Deploy API
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @pointly/api build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        working-directory: apps/api
        run: |
          mkdir -p lambda-package
          cp -r dist/* lambda-package/
          cp package.json lambda-package/
          cd lambda-package
          pnpm install --prod --ignore-scripts
          zip -r ../lambda.zip .

      - name: Deploy Lambda
        working-directory: apps/api
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name Pointly-Api-prod \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$FUNCTION_NAME" ]; then
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --zip-file fileb://lambda.zip
            echo "Lambda updated: $FUNCTION_NAME"
          else
            echo "Lambda function not found, skipping deployment"
          fi

  deploy-merchant-dashboard:
    name: Deploy Merchant Dashboard
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Merchant Dashboard
        run: pnpm --filter @pointly/merchant-dashboard build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.api_url }}
          NEXT_PUBLIC_ENVIRONMENT: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy to S3 + CloudFront (uncomment when S3 bucket is created)
      # - name: Deploy to S3
      #   run: |
      #     aws s3 sync apps/merchant-dashboard/.next/static s3://${{ secrets.S3_BUCKET_PRODUCTION }}/static --delete
      #     aws s3 sync apps/merchant-dashboard/public s3://${{ secrets.S3_BUCKET_PRODUCTION }}/public --delete

      # - name: Invalidate CloudFront
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id ${{ secrets.CLOUDFRONT_DIST_PRODUCTION }} \
      #       --paths "/*"

  create-release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-deploy-api, deploy-merchant-dashboard]
    if: success() && github.event_name == 'release'
    steps:
      - name: Add deployment info to release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = context.payload.release.id;
            const body = context.payload.release.body || '';
            const deploymentInfo = `

            ---
            ## Deployment Info
            - **Deployed at:** ${new Date().toISOString()}
            - **API URL:** ${{ needs.deploy-infrastructure.outputs.api_url }}
            - **Commit:** ${context.sha}
            `;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: body + deploymentInfo
            });

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-deploy-api, deploy-merchant-dashboard]
    if: success()
    steps:
      - name: Production deployment successful
        run: |
          echo "Production deployment completed successfully!"
          echo "API URL: ${{ needs.deploy-infrastructure.outputs.api_url }}"
          echo "Version: ${{ github.event.release.tag_name || 'manual' }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-and-deploy-api, deploy-merchant-dashboard]
    if: failure()
    steps:
      - name: Production deployment failed
        run: |
          echo "PRODUCTION DEPLOYMENT FAILED!"
          echo "Immediate attention required."
          exit 1
