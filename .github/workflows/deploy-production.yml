name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm deployment'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'
  AWS_REGION: me-south-1
  ENVIRONMENT: prod
  TF_VERSION: '1.6.0'

jobs:
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "production" ]]; then
            echo "Deployment not confirmed. Please type 'production' to confirm."
            exit 1
          fi

      - name: Validate release
        if: github.event_name == 'release'
        run: |
          echo "Deploying release: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"

  deploy-infrastructure:
    name: Deploy Infrastructure (Production)
    runs-on: ubuntu-latest
    needs: validate-deployment
    permissions:
      contents: read
    environment:
      name: production
      url: https://api.pointly.sa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API for Lambda
        run: pnpm --filter @pointly/api build:lambda

      - name: Package Lambda
        run: |
          cd apps/api/dist/lambda
          zip -r ../../../../packages/infrastructure/terraform/lambda.zip .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: packages/infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: packages/infrastructure/terraform
        run: |
          terraform workspace select prod || terraform workspace new prod
          terraform plan -var-file=environments/prod.tfvars -var="lambda_zip_path=lambda.zip" -out=tfplan

      - name: Terraform Apply
        working-directory: packages/infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: packages/infrastructure/terraform
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw dashboard_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw distribution_id)" >> $GITHUB_OUTPUT

    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      lambda_function_name: ${{ steps.tf-outputs.outputs.lambda_function_name }}
      bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.tf-outputs.outputs.distribution_id }}

  deploy-merchant-dashboard:
    name: Deploy Merchant Dashboard
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Merchant Dashboard
        run: pnpm --filter @pointly/merchant-dashboard build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.api_url }}
          NEXT_PUBLIC_ENVIRONMENT: production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/merchant-dashboard/out s3://${{ needs.deploy-infrastructure.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.distribution_id }} \
            --paths "/*"

  create-release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard]
    if: success() && github.event_name == 'release'
    steps:
      - name: Add deployment info to release
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = context.payload.release.id;
            const body = context.payload.release.body || '';
            const deploymentInfo = `

            ---
            ## Deployment Info
            - **Deployed at:** ${new Date().toISOString()}
            - **API URL:** ${{ needs.deploy-infrastructure.outputs.api_url }}
            - **Commit:** ${context.sha}
            `;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: body + deploymentInfo
            });

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard]
    if: success()
    steps:
      - name: Production deployment successful
        run: |
          echo "Production deployment completed successfully!"
          echo "API URL: ${{ needs.deploy-infrastructure.outputs.api_url }}"
          echo "Version: ${{ github.event.release.tag_name || 'manual' }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard]
    if: failure()
    steps:
      - name: Production deployment failed
        run: |
          echo "PRODUCTION DEPLOYMENT FAILED!"
          echo "Immediate attention required."
          exit 1
