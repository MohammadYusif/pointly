name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.28.2'
  AWS_REGION: me-south-1
  ENVIRONMENT: dev
  TF_VERSION: '1.6.0'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure (Staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API for Lambda
        run: pnpm --filter @pointly/api build

      - name: Package Lambda
        working-directory: apps/api
        run: |
          mkdir -p lambda-package
          cp -r dist/* lambda-package/
          cp package.json lambda-package/
          cd lambda-package
          pnpm install --prod --ignore-scripts
          zip -r ../../packages/infrastructure/terraform/lambda.zip .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: packages/infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: packages/infrastructure/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=environments/dev.tfvars -var="lambda_zip_path=lambda.zip" -out=tfplan

      - name: Terraform Apply
        working-directory: packages/infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: packages/infrastructure/terraform
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw dashboard_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw distribution_id)" >> $GITHUB_OUTPUT

    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      lambda_function_name: ${{ steps.tf-outputs.outputs.lambda_function_name }}
      bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.tf-outputs.outputs.distribution_id }}

  deploy-merchant-dashboard:
    name: Deploy Merchant Dashboard
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Merchant Dashboard
        run: pnpm --filter @pointly/merchant-dashboard build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.api_url }}
          NEXT_PUBLIC_ENVIRONMENT: staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/merchant-dashboard/out s3://${{ needs.deploy-infrastructure.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.distribution_id }} \
            --paths "/*"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard]
    if: success()
    steps:
      - name: Deployment successful
        run: |
          echo "Staging deployment completed successfully!"
          echo "API URL: ${{ needs.deploy-infrastructure.outputs.api_url }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard]
    if: failure()
    steps:
      - name: Deployment failed
        run: |
          echo "Staging deployment failed!"
          exit 1
