name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'
  AWS_REGION: eu-west-1
  ENVIRONMENT: dev
  TF_VERSION: '1.14.0'

jobs:
  guard:
    name: Guard — CI must pass
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed
        run: echo "CI workflow passed — proceeding with staging deploy"

  deploy-infrastructure:
    name: Deploy Infrastructure (Staging)
    runs-on: ubuntu-latest
    needs: [guard]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API for Lambda
        run: pnpm --filter @pointly/api build:lambda

      - name: Build SMS Consumer Lambda
        run: pnpm --filter @pointly/api build:lambda:sms-consumer

      - name: Package Lambda
        run: |
          cd apps/api/dist/lambda
          zip -r ../../../../packages/infrastructure/terraform/lambda.zip .

      - name: Package SMS Consumer Lambda
        run: |
          cd apps/api/dist/lambda-sms-consumer
          zip -r ../../../../packages/infrastructure/terraform/lambda-sms-consumer.zip .

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: packages/infrastructure/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: packages/infrastructure/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=environments/dev.tfvars -var="lambda_zip_path=lambda.zip" -out=tfplan

      - name: Terraform Apply
        working-directory: packages/infrastructure/terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform outputs
        id: tf-outputs
        working-directory: packages/infrastructure/terraform
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "bucket_name=$(terraform output -raw dashboard_bucket_name)" >> $GITHUB_OUTPUT
          echo "distribution_id=$(terraform output -raw distribution_id)" >> $GITHUB_OUTPUT
          echo "landing_bucket_name=$(terraform output -raw landing_bucket_name)" >> $GITHUB_OUTPUT
          echo "landing_distribution_id=$(terraform output -raw landing_distribution_id)" >> $GITHUB_OUTPUT
          echo "customer_portal_bucket_name=$(terraform output -raw customer_portal_bucket_name)" >> $GITHUB_OUTPUT
          echo "customer_portal_distribution_id=$(terraform output -raw customer_portal_distribution_id)" >> $GITHUB_OUTPUT
          echo "merchant_user_pool_id=$(terraform output -raw merchant_user_pool_id)" >> $GITHUB_OUTPUT
          echo "merchant_user_pool_client_id=$(terraform output -raw merchant_user_pool_client_id)" >> $GITHUB_OUTPUT
          echo "customer_user_pool_id=$(terraform output -raw customer_user_pool_id)" >> $GITHUB_OUTPUT
          echo "customer_user_pool_client_id=$(terraform output -raw customer_user_pool_client_id)" >> $GITHUB_OUTPUT

    outputs:
      api_url: ${{ steps.tf-outputs.outputs.api_url }}
      lambda_function_name: ${{ steps.tf-outputs.outputs.lambda_function_name }}
      bucket_name: ${{ steps.tf-outputs.outputs.bucket_name }}
      distribution_id: ${{ steps.tf-outputs.outputs.distribution_id }}
      landing_bucket_name: ${{ steps.tf-outputs.outputs.landing_bucket_name }}
      landing_distribution_id: ${{ steps.tf-outputs.outputs.landing_distribution_id }}
      customer_portal_bucket_name: ${{ steps.tf-outputs.outputs.customer_portal_bucket_name }}
      customer_portal_distribution_id: ${{ steps.tf-outputs.outputs.customer_portal_distribution_id }}
      merchant_user_pool_id: ${{ steps.tf-outputs.outputs.merchant_user_pool_id }}
      merchant_user_pool_client_id: ${{ steps.tf-outputs.outputs.merchant_user_pool_client_id }}
      customer_user_pool_id: ${{ steps.tf-outputs.outputs.customer_user_pool_id }}
      customer_user_pool_client_id: ${{ steps.tf-outputs.outputs.customer_user_pool_client_id }}

  deploy-merchant-dashboard:
    name: Deploy Merchant Dashboard
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Merchant Dashboard
        run: pnpm --filter @pointly/merchant-dashboard build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.api_url }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ needs.deploy-infrastructure.outputs.merchant_user_pool_id }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ needs.deploy-infrastructure.outputs.merchant_user_pool_client_id }}
          NEXT_PUBLIC_ENVIRONMENT: staging

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/merchant-dashboard/out s3://${{ needs.deploy-infrastructure.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.distribution_id }} \
            --paths "/*"

  deploy-customer-portal:
    name: Deploy Customer Portal
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Customer Portal
        run: pnpm --filter @pointly/customer-portal build
        env:
          NEXT_PUBLIC_API_URL: ${{ needs.deploy-infrastructure.outputs.api_url }}
          NEXT_PUBLIC_CUSTOMER_USER_POOL_ID: ${{ needs.deploy-infrastructure.outputs.customer_user_pool_id }}
          NEXT_PUBLIC_CUSTOMER_CLIENT_ID: ${{ needs.deploy-infrastructure.outputs.customer_user_pool_client_id }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/customer-portal/out s3://${{ needs.deploy-infrastructure.outputs.customer_portal_bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.customer_portal_distribution_id }} \
            --paths "/*"

  deploy-landing:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Landing Page
        run: pnpm --filter @pointly/landing build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync apps/landing/out s3://${{ needs.deploy-infrastructure.outputs.landing_bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-infrastructure.outputs.landing_distribution_id }} \
            --paths "/*"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard, deploy-customer-portal, deploy-landing]
    if: success()
    steps:
      - name: Deployment successful
        run: |
          echo "Staging deployment completed successfully!"
          echo "API URL: ${{ needs.deploy-infrastructure.outputs.api_url }}"

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-merchant-dashboard, deploy-customer-portal, deploy-landing]
    if: failure()
    steps:
      - name: Deployment failed
        run: |
          echo "Staging deployment failed!"
          exit 1
