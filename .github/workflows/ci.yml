name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.2'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm exec biome check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: MohammadYusif/pointly
          files: ./apps/api/coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build
        env:
          # Placeholder values so Next.js env validation passes at build time.
          # Real values are injected by deploy-staging / deploy-production pipelines.
          NEXT_PUBLIC_API_URL: https://placeholder.example.com
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: eu-west-1_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder-client-id
          NEXT_PUBLIC_CUSTOMER_USER_POOL_ID: eu-west-1_placeholder
          NEXT_PUBLIC_CUSTOMER_CLIENT_ID: placeholder-client-id
          NEXT_PUBLIC_MERCHANT_URL: https://merchant.placeholder.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            apps/*/.next
            packages/*/dist
          retention-days: 7

  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"

      - name: Create dummy Lambda zip for validation
        working-directory: packages/infrastructure/terraform
        run: echo "placeholder" | zip lambda.zip -

      - name: Terraform Format Check
        working-directory: packages/infrastructure/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init (local backend — no AWS creds needed)
        working-directory: packages/infrastructure/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: packages/infrastructure/terraform
        run: terraform validate

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          # fast-jwt has unpatched critical CVEs (GHSA-mvf2-f6gm-w987, GHSA-hm7r-c7qw-ghp6)
          # with no patched version available. We audit and report but don't fail until a fix exists.
          pnpm audit --audit-level=critical --json > audit-results.json || true
          # Filter out phantom patched versions like "<0.0.0" which aren't real releases
          CRITICAL=$(cat audit-results.json | python3 -c "
          import sys,json,re
          d=json.load(sys.stdin)
          count=0
          for v in d.get('advisories',{}).values():
              if v.get('severity')=='critical':
                  patched=v.get('patchedVersions',[])
                  # Skip phantom versions like '<0.0.0' that aren't real semver releases
                  real_patches=[p for p in patched if p and p != '<0.0.0' and not p.startswith('<0.')]
                  if real_patches:
                      count+=1
          print(count)
          " 2>/dev/null || echo "0")
          if [ "$CRITICAL" -gt "0" ]; then
            echo "Found $CRITICAL critical vulnerabilities with available patches"
            exit 1
          fi
          echo "No patchable critical vulnerabilities found"

  all-checks-pass:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, build, terraform-validate]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.type-check.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.terraform-validate.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"
