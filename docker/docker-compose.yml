services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    container_name: pointly-dynamodb-local
    ports:
      - '8000:8000'
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data -port 8000'
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - pointly-network

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: pointly-dynamodb-admin
    ports:
      - '8001:8001'
    environment:
      DYNAMO_ENDPOINT: 'http://dynamodb-local:8000'
      AWS_REGION: 'me-south-1'
      AWS_ACCESS_KEY_ID: 'local'
      AWS_SECRET_ACCESS_KEY: 'local'
    depends_on:
      - dynamodb-local
    networks:
      - pointly-network

volumes:
  dynamodb-data:

networks:
  pointly-network:
    driver: bridge
